services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      # 仅用于判断"有没有会话 cookie"，真正的鉴权在后端
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-auth_token}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      BACKEND_URL: ${BACKEND_URL:-http://backend:3001}
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATABASE_URL: ${APP_DATABASE_URL:-postgresql://postgres:postgres@db:5432/lyh-next-db}
      AUTH_SECRET: ${AUTH_SECRET:-please-change-this-secret}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-7d}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-auth_token}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lyh-next-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '6432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lyh-next-db']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
